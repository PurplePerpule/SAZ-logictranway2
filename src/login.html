<!doctype html>
<html lang="ru">
    <head>
        <link rel="stylesheet" href="./style.css" />
        <title>LogicTrans BY — Вход</title>
        <script>
            // Определяем API для login.html
            const API = "";
        </script>
    </head>
    <body>
        <h1>Вход в систему</h1>
        <div
            style="
                margin: 20px auto;
                width: 300px;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 5px;
            "
        >
            <input
                type="text"
                id="username"
                placeholder="Логин"
                style="width: 100%; margin-bottom: 10px; padding: 8px"
            />
            <input
                type="password"
                id="password"
                placeholder="Пароль"
                style="width: 100%; margin-bottom: 20px; padding: 8px"
            />
            <button
                onclick="login()"
                style="
                    width: 100%;
                    padding: 10px;
                    background-color: #007bff;
                    color: white;
                    border: none;
                    border-radius: 3px;
                "
            >
                Войти
            </button>
        </div>

        <div style="text-align: center; margin-top: 20px; color: #666">
            <p>Для получения доступа обратитесь к администратору системы</p>
        </div>
        <script>
            // Проверяем, авторизован ли пользователь
            const token = localStorage.getItem("token");
            if (token) {
                // Если есть токен, проверяем роль и перенаправляем
                fetch(`${API}/me`, {
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                })
                    .then((response) => response.json())
                    .then((user) => {
                        if (user.role === "admin") {
                            window.location.href = "admin.html";
                        } else {
                            window.location.href = "index.html";
                        }
                    })
                    .catch(() => {
                        // Если токен невалидный, очищаем и остаемся на странице входа
                        localStorage.removeItem("token");
                    });
            }
        </script>
        <script>
            async function login() {
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                if (!username || !password) {
                    alert("Введите логин и пароль");
                    return;
                }

                try {
                    const res = await fetch(`${API}/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password }),
                    });

                    if (res.ok) {
                        const data = await res.json();
                        localStorage.setItem("token", data.token);

                        if (data.role === "admin") {
                            window.location = "admin.html";
                        } else {
                            window.location = "index.html";
                        }
                    } else {
                        const error = await res.json();
                        alert(error.error || "Неверный логин или пароль");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Ошибка соединения с сервером");
                }
            }
        </script>
    </body>
</html>

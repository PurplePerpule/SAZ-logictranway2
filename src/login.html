<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Вход в систему</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div class="login-container">
            <h1>Вход в систему</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" required />
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required />
                </div>
                <button type="submit">Войти</button>
            </form>
            <div id="error" style="color: red; margin-top: 15px"></div>
        </div>

        <script>
            // Определяем API для текущего хоста
            const API = window.location.origin;

            // Функция для получения параметров из URL
            function getQueryParam(name) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(name);
            }

            // Получаем параметр next из URL
            const nextPage = getQueryParam("next");

            document
                .getElementById("loginForm")
                .addEventListener("submit", function (event) {
                    event.preventDefault();
                    const username = document.getElementById("username").value;
                    const password = document.getElementById("password").value;

                    fetch(API + "/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password }),
                    })
                        .then((response) => {
                            if (response.ok) {
                                return response.json();
                            } else {
                                throw new Error("Ошибка входа");
                            }
                        })
                        .then((data) => {
                            if (data.token) {
                                localStorage.setItem("token", data.token);

                                // Если есть next параметр, перенаправляем туда
                                if (nextPage) {
                                    window.location.href = nextPage;
                                } else {
                                    // Иначе по умолчанию в зависимости от роли
                                    if (data.role === "admin") {
                                        window.location.href = "admin.html";
                                    } else {
                                        window.location.href = "index.html";
                                    }
                                }
                            } else {
                                alert(data.error || "Ошибка входа");
                            }
                        })
                        .catch((error) => {
                            console.error("Ошибка:", error);
                            document.getElementById("error").textContent =
                                "Ошибка входа. Проверьте логин и пароль.";
                        });
                });
        </script>
    </body>
</html>

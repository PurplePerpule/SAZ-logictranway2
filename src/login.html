<!doctype html>
<html lang="ru">
    <head>
        <link rel="stylesheet" href="./style.css" />
        <title>LogicTrans BY — Вход</title>
    </head>
    <body>
        <h1>Вход в систему</h1>
        <div class="login-form">
            <input type="text" id="username" placeholder="Логин" />
            <input type="password" id="password" placeholder="Пароль" />
            <button onclick="login()">Войти</button>
        </div>

        <div class="login-footer">
            <p>Для получения доступа обратитесь к администратору системы</p>
        </div>

        <script>
            // Получаем текущий хост для API
            const currentHost = window.location.origin;
            console.log("Current host:", currentHost);

            async function login() {
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                if (!username || !password) {
                    alert("Введите логин и пароль");
                    return;
                }

                try {
                    const res = await fetch("/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            Origin: window.location.origin,
                        },
                        credentials: "include", // Важно: включаем куки
                        body: JSON.stringify({ username, password }),
                    });

                    const data = await res.json();

                    if (res.ok) {
                        console.log("Login successful, role:", data.role);

                        // Сохраняем данные в localStorage
                        localStorage.setItem("token", data.token);
                        localStorage.setItem("userRole", data.role);
                        localStorage.setItem("userId", data.user_id);

                        // Редирект в зависимости от роли
                        if (data.role === "admin") {
                            window.location.href = "/admin.html";
                        } else {
                            window.location.href = "/index.html";
                        }
                    } else {
                        alert(data.error || "Неверный логин или пароль");
                    }
                } catch (err) {
                    console.error("Login error:", err);
                    alert("Ошибка соединения с сервером: " + err.message);
                }
            }

            // Проверяем авторизацию при загрузке
            document.addEventListener("DOMContentLoaded", function () {
                const token = localStorage.getItem("token");
                if (token) {
                    // Проверяем токен
                    fetch("/me", {
                        headers: {
                            Authorization: `Bearer ${token}`,
                            Origin: window.location.origin,
                        },
                        credentials: "include",
                    })
                        .then((response) => {
                            if (response.ok) {
                                return response.json();
                            }
                            throw new Error("Invalid token");
                        })
                        .then((user) => {
                            if (user.role === "admin") {
                                window.location.href = "/admin.html";
                            } else {
                                window.location.href = "/index.html";
                            }
                        })
                        .catch(() => {
                            // Если токен невалидный, очищаем
                            localStorage.removeItem("token");
                            localStorage.removeItem("userRole");
                            localStorage.removeItem("userId");
                        });
                }
            });
        </script>
    </body>
</html>

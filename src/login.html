<!doctype html>
<html lang="ru">
    <head>
        <link rel="stylesheet" href="./style.css" />
        <title>LogicTrans BY — Вход</title>
        <style>
            .login-form {
                margin: 20px auto;
                width: 300px;
                padding: 20px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }

            .login-form input {
                width: 100%;
                margin-bottom: 10px;
                padding: 8px;
                box-sizing: border-box;
            }

            .login-form button {
                width: 100%;
                padding: 10px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 3px;
                cursor: pointer;
            }

            .login-footer {
                text-align: center;
                margin-top: 20px;
                color: #666;
            }

            .error-message {
                color: red;
                margin-top: 10px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>Вход в систему</h1>
        <div class="login-form">
            <input type="text" id="username" placeholder="Логин" />
            <input type="password" id="password" placeholder="Пароль" />
            <button onclick="login()">Войти</button>
            <div id="errorMessage" class="error-message"></div>
        </div>

        <div class="login-footer">
            <p>Для получения доступа обратитесь к администратору системы</p>
        </div>

        <script>
            // Функция для отображения ошибок
            function showError(message) {
                const errorDiv = document.getElementById("errorMessage");
                errorDiv.textContent = message;
            }

            // Функция для очистки ошибок
            function clearError() {
                const errorDiv = document.getElementById("errorMessage");
                errorDiv.textContent = "";
            }

            // Функция логина
            async function login() {
                clearError();

                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                if (!username || !password) {
                    showError("Введите логин и пароль");
                    return;
                }

                try {
                    console.log("Sending login request...");

                    const response = await fetch("/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ username, password }),
                    });

                    console.log("Response status:", response.status);

                    // Сначала получаем текст, чтобы понять, что пришло
                    const responseText = await response.text();
                    console.log("Response text:", responseText);

                    let data;
                    try {
                        data = JSON.parse(responseText);
                    } catch (e) {
                        console.error("Failed to parse JSON:", e);
                        showError("Ошибка сервера: неверный формат ответа");
                        return;
                    }

                    if (response.ok) {
                        console.log("Login successful:", data);

                        // Сохраняем данные в localStorage
                        localStorage.setItem("token", data.token);
                        localStorage.setItem("userRole", data.role);
                        localStorage.setItem("userId", data.user_id);
                        localStorage.setItem("username", data.username);

                        // Редирект в зависимости от роли
                        if (data.role === "admin") {
                            window.location.href = "/admin.html";
                        } else {
                            window.location.href = "/index.html";
                        }
                    } else {
                        showError(data.error || "Неверный логин или пароль");
                    }
                } catch (error) {
                    console.error("Login error:", error);
                    showError("Ошибка соединения с сервером");
                }
            }

            // Проверяем авторизацию при загрузке
            document.addEventListener("DOMContentLoaded", function () {
                console.log("Page loaded, checking authentication...");

                const token = localStorage.getItem("token");
                if (token) {
                    console.log("Found token in localStorage, checking...");

                    // Проверяем токен
                    fetch("/me", {
                        headers: {
                            "Content-Type": "application/json",
                        },
                    })
                        .then((response) => {
                            if (response.ok) {
                                return response.json();
                            }
                            throw new Error("Invalid token");
                        })
                        .then((user) => {
                            console.log("User authenticated:", user);
                            if (user.role === "admin") {
                                window.location.href = "/admin.html";
                            } else {
                                window.location.href = "/index.html";
                            }
                        })
                        .catch((error) => {
                            console.log("Token invalid:", error);
                            // Если токен невалидный, очищаем
                            localStorage.removeItem("token");
                            localStorage.removeItem("userRole");
                            localStorage.removeItem("userId");
                            localStorage.removeItem("username");
                        });
                } else {
                    console.log("No token found, showing login page");
                }

                // Автофокус на поле логина
                document.getElementById("username").focus();

                // Обработка нажатия Enter
                document
                    .getElementById("password")
                    .addEventListener("keypress", function (e) {
                        if (e.key === "Enter") {
                            login();
                        }
                    });
            });
        </script>
    </body>
</html>

<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SAZ LogicTranway - Описание груза</title>
        <link rel="stylesheet" href="./style.css" />
        <script
            src="https://api-maps.yandex.ru/2.1/?apikey=28cae7bd-c3b7-4145-94bb-923d2ab7c54e&lang=ru_RU"
            type="text/javascript"
        ></script>
    </head>
    <body>
        <div>
            <button onclick="logout()" class="logout-container">Выйти</button>
        </div>
        <div class="container">
            <!-- БЛОК ЗАЯВИТЕЛЯ (всегда сверху, не очищается) -->
            <div class="applicant-section">
                <h2>Данные заявителя</h2>
                <div class="form-group">
                    <label>Заявитель <span>*</span></label>
                    <input
                        type="text"
                        id="applicant"
                        placeholder="Иванов И.И."
                        required
                    />
                </div>
                <div class="form-group">
                    <label>Отдел <span>*</span></label>
                    <input
                        type="text"
                        id="department"
                        placeholder="ОГТ / ОМТС / Цех №5"
                        required
                    />
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input
                        type="text"
                        id="phone_number"
                        placeholder="+375 (29) 123-45-67"
                    />
                </div>
            </div>

            <!-- БЛОК ДАТЫ (отдельный, не очищается при добавлении груза) -->
            <div class="date-section">
                <h2>Дата отправления</h2>
                <div class="form-group" style="max-width: 300px">
                    <label> Желаемая дата отправления: </label>
                    <input type="date" id="preferred_date" />
                    <div>
                        <em
                            >Эта дата будет применена ко всем грузам в
                            заявке</em
                        >
                    </div>
                </div>
            </div>

            <!-- БЛОК ДОБАВЛЕНИЯ ГРУЗА -->
            <div class="cargo-form-section">
                <h2>Добавить груз в заявку</h2>
                <form id="cargoForm">
                    <div class="form-group">
                        <label>Наименование груза</label>
                        <input type="text" id="name" required />
                    </div>
                    <div class="form-group">
                        <label>Способ добавления:</label>
                        <select id="cargo_type" onchange="toggleCargoType()">
                            <option value="dimensions">По габаритам</option>
                            <option value="volume">По объему</option>
                        </select>
                    </div>

                    <div id="dimensions_block">
                        <div>
                            <div class="form-group">
                                <label>Вес (кг)</label>
                                <input
                                    type="number"
                                    step="0.1"
                                    id="weight"
                                    required
                                />
                            </div>
                            <div class="form-group">
                                <label>Длина (м)</label>
                                <input
                                    type="number"
                                    step="0.01"
                                    id="length"
                                    required
                                />
                            </div>
                            <div class="form-group">
                                <label>Ширина (м)</label>
                                <input
                                    type="number"
                                    step="0.01"
                                    id="width"
                                    required
                                />
                            </div>
                            <div class="form-group">
                                <label>Высота (м)</label>
                                <input
                                    type="number"
                                    step="0.01"
                                    id="height"
                                    required
                                />
                            </div>
                        </div>
                    </div>

                    <!-- Блок объема (по умолчанию скрытый) -->
                    <div id="volume_block" style="display: none">
                        <div>
                            <div class="form-group">
                                <label>Вес (кг)</label>
                                <input
                                    type="number"
                                    step="0.1"
                                    id="volume_weight"
                                />
                            </div>
                            <div class="form-group">
                                <label>Объем (м³)</label>
                                <input type="number" step="0.01" id="volume" />
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Количество мест</label>
                        <input
                            type="number"
                            min="1"
                            id="quantity"
                            value="1"
                            required
                        />
                    </div>

                    <div>
                        <div class="form-group autocomplete-container">
                            <label>Куда доставить</label>
                            <input
                                type="text"
                                id="departure"
                                placeholder="г. Сморгонь, ул. Советская 10"
                                required
                                data-type="departure"
                                oninput="searchAddress(this)"
                            />
                            <div
                                class="autocomplete-dropdown"
                                id="departureDropdown"
                            ></div>
                        </div>

                        <div class="form-group autocomplete-container">
                            <label>Отууда забрать</label>
                            <input
                                type="text"
                                id="destination"
                                placeholder="г. Минск, пр. Победителей 100"
                                required
                                data-type="destination"
                                oninput="searchAddress(this)"
                            />
                            <div
                                class="autocomplete-dropdown"
                                id="destinationDropdown"
                            ></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Тип тента</label>
                        <select id="tent_type">
                            <option value="closed">Закрытый (тент)</option>
                            <option value="open">Открытый (бортовой)</option>
                        </select>
                    </div>
                    <button type="button" onclick="addToList()">
                        Добавить груз в заявку
                    </button>
                </form>
            </div>

            <!-- СПИСОК ГРУЗОВ -->
            <div class="list-section">
                <h2>Грузы в заявке (<span id="cargoCount">0</span>)</h2>
                <table id="cargoTable">
                    <thead>
                        <tr>
                            <th>Наименование</th>
                            <th>Вес (ед.)</th>
                            <th>Габариты / Тип</th>
                            <th>Объем</th>
                            <th>Кол-во</th>
                            <th>Общий вес</th>
                            <th>Тип тента</th>
                            <th>Откуда</th>
                            <th>Куда</th>
                            <th>Способ</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- КНОПКА ОТПРАВКИ -->
            <div>
                <button
                    onclick="sendOrderToDispatcher()"
                    class="btn-dispatcher"
                >
                    ОТПРАВИТЬ ЗАЯВКУ ДИСПЕТЧЕРУ
                </button>
                <button onclick="clearAll()">Очистить все</button>
            </div>

            <div class="map-section">
                <div id="map"></div>
            </div>
        </div>

        <script src="./script.js"></script>
        <script>
            const token = localStorage.getItem("token");
            if (!token) {
                window.location = "login.html";
            }

            // Установить сегодняшнюю дату по умолчанию при загрузке
            document.addEventListener("DOMContentLoaded", function () {
                const today = new Date().toISOString().split("T")[0];
                const dateInput = document.getElementById("preferred_date");
                if (dateInput && !dateInput.value) {
                    dateInput.value = today;
                }
            });
        </script>
    </body>
</html>

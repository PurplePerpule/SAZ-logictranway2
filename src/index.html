<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SAZ LogicTranway - Описание груза</title>
        <link rel="stylesheet" href="./style.css" />

        <script
            src="https://api-maps.yandex.ru/2.1/?apikey=28cae7bd-c3b7-4145-94bb-923d2ab7c54e&lang=ru_RU"
            type="text/javascript"
        ></script>
        <style>
            .btn-dispatcher {
                background: #28a745 !important;
                color: white !important;
                font-weight: bold;
                padding: 14px 24px !important;
                font-size: 16px;
                margin-left: 10px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="list-section">
                <div id="cargoList">
                    <h3>Список грузов</h3>
                    <table id="cargoTable">
                        <thead>
                            <tr>
                                <th>Название</th>
                                <th>Вес (кг)</th>
                                <th>Длина (м)</th>
                                <th>Ширина (м)</th>
                                <th>Высота (м)</th>
                                <th>Количество</th>
                                <th>Точка отправления</th>
                                <th>Точка назначения</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="right-section">
                <div class="form-section">
                    <h1>Описание объекта для перевозки</h1>
                    <form id="cargoForm">
                        <div class="form-group">
                            <label for="name">Название:</label>
                            <input type="text" id="name" name="name" required />
                        </div>
                        <div class="form-group">
                            <label for="weight">Вес (кг):</label>
                            <input
                                type="number"
                                id="weight"
                                name="weight"
                                min="0"
                                step="0.1"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label for="length">Длина (м):</label>
                            <input
                                type="number"
                                id="length"
                                name="length"
                                min="0"
                                step="0.01"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label for="width">Ширина (м):</label>
                            <input
                                type="number"
                                id="width"
                                name="width"
                                min="0"
                                step="0.01"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label for="height">Высота (м):</label>
                            <input
                                type="number"
                                id="height"
                                name="height"
                                min="0"
                                step="0.01"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label for="quantity">Количество:</label>
                            <input
                                type="number"
                                id="quantity"
                                name="quantity"
                                min="1"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label for="departure">Точка отправления:</label>
                            <input
                                type="text"
                                id="departure"
                                name="departure"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label for="destination">Точка назначения:</label>
                            <input
                                type="text"
                                id="destination"
                                name="destination"
                                required
                            />
                        </div>

                        <div style="margin-top: 20px">
                            <button type="button" onclick="addToList()">
                                Добавить в список
                            </button>
                            <button
                                type="button"
                                onclick="sendOrderToDispatcher()"
                                class="btn-dispatcher"
                            >
                                Отправить заявку диспетчеру
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="map-section">
                <div id="map"></div>
            </div>
        </div>

        <script src="./script.js"></script>
        <script>
            const token = localStorage.getItem("token");
            if (!token) {
                window.location = "login.html";
            }
        </script>
    </body>
</html>

<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SAZ LogicTranway - Описание груза</title>
        <link rel="stylesheet" href="./style.css" />
        <script
            src="https://api-maps.yandex.ru/2.1/?apikey=28cae7bd-c3b7-4145-94bb-923d2ab7c54e&lang=ru_RU"
            type="text/javascript"
        ></script>
        <style>
            .btn-dispatcher {
                background: #28a745 !important;
                color: white !important;
                font-weight: bold;
                padding: 14px 24px !important;
                font-size: 16px;
                margin-left: 10px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <!-- БЛОК ЗАЯВИТЕЛЯ (всегда сверху, не очищается) -->
            <div
                class="applicant-section"
                style="
                    background: #f8f9fa;
                    padding: 20px;
                    border-radius: 10px;
                    margin-bottom: 20px;
                    border: 2px solid #007bff;
                "
            >
                <h2 style="color: #007bff; margin-top: 0">Данные заявителя</h2>
                <div class="form-group">
                    <label>Заявитель <span style="color: red">*</span></label>
                    <input
                        type="text"
                        id="applicant"
                        placeholder="Иванов И.И."
                        required
                        style="width: 100%; padding: 10px; font-size: 16px"
                    />
                </div>
                <div class="form-group">
                    <label>Отдел <span style="color: red">*</span></label>
                    <input
                        type="text"
                        id="department"
                        placeholder="ОГТ / ОМТС / Цех №5"
                        required
                        style="width: 100%; padding: 10px; font-size: 16px"
                    />
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input
                        type="text"
                        id="phone_number"
                        placeholder="+375 (29) 123-45-67"
                        style="width: 100%; padding: 10px; font-size: 16px"
                    />
                </div>
            </div>

            <!-- БЛОК ДОБАВЛЕНИЯ ГРУЗА -->
            <div class="cargo-form-section">
                <h2>Добавить груз в заявку</h2>
                <form id="cargoForm">
                    <div class="form-group">
                        <label>Наименование груза</label>
                        <input type="text" id="name" required />
                    </div>
                    <div
                        style="
                            display: grid;
                            grid-template-columns: 1fr 1fr 1fr 1fr;
                            gap: 10px;
                        "
                    >
                        <div class="form-group">
                            <label>Вес (кг)</label>
                            <input
                                type="number"
                                step="0.1"
                                id="weight"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label>Длина (м)</label>
                            <input
                                type="number"
                                step="0.01"
                                id="length"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label>Ширина (м)</label>
                            <input
                                type="number"
                                step="0.01"
                                id="width"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label>Высота (м)</label>
                            <input
                                type="number"
                                step="0.01"
                                id="height"
                                required
                            />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Количество мест</label>
                        <input
                            type="number"
                            min="1"
                            id="quantity"
                            value="1"
                            required
                        />
                    </div>

                    <div style="margin: 10px 0">
                        <label for="preferred_time"
                            >Желаемое время отправления (ЧЧ:ММ):</label
                        >
                        <input type="time" id="preferred_time" step="300" />
                    </div>
                    <div
                        style="
                            display: grid;
                            grid-template-columns: 1fr 1fr;
                            gap: 10px;
                        "
                    >
                        <div class="form-group">
                            <label>Откуда забрать</label>
                            <input
                                type="text"
                                id="departure"
                                placeholder="г. Сморгонь, ул. Советская 10"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label>Куда доставить</label>
                            <input
                                type="text"
                                id="destination"
                                placeholder="г. Минск, пр. Победителей 100"
                                required
                            />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Тип тента</label>
                        <select
                            id="tent_type"
                            style="width: 100%; padding: 10px; font-size: 16px"
                        >
                            <option value="closed">Закрытый (тент)</option>
                            <option value="open">Открытый (бортовой)</option>
                        </select>
                    </div>
                    </div>
                    <button
                        type="button"
                        onclick="addToList()"
                        style="
                            background: #007bff;
                            color: white;
                            padding: 12px 24px;
                            border: none;
                            border-radius: 6px;
                            font-size: 16px;
                        "
                    >
                        Добавить груз в заявку
                    </button>
                </form>
            </div>

            <!-- СПИСОК ГРУЗОВ -->
            <div class="list-section" style="margin-top: 30px">
                <h2>Грузы в заявке (<span id="cargoCount">0</span>)</h2>
                <table id="cargoTable">
                    <thead>
                        <tr>
                            <th>Наименование</th>
                            <th>Вес</th>
                            <th>Длина</th>
                            <th>Ширина</th>
                            <th>Высота</th>
                            <th>Кол-во</th>
                            <th>Тип тента</th>
                            <th>Откуда</th>
                            <th>Куда</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- КНОПКА ОТПРАВКИ -->
            <div style="text-align: center; margin: 30px 0">
                <button
                    onclick="sendOrderToDispatcher()"
                    class="btn-dispatcher"
                    style="font-size: 20px; padding: 16px 40px"
                >
                    ОТПРАВИТЬ ЗАЯВКУ ДИСПЕТЧЕРУ
                </button>
            </div>

            <div class="map-section">
                <div
                    id="map"
                    style="height: 500px; border-radius: 10px; overflow: hidden"
                ></div>
            </div>
        </div>

        <script src="./script.js"></script>
        <script>
            const token = localStorage.getItem("token");
            if (!token) {
                window.location = "login.html";
            }
        </script>
    </body>
</html>
